
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Catálogo de libros</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.5;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
        }

        input {
            padding: 10px;
            width: 100%;
            max-width: 450px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .libro {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .libro h3 {
            margin-top: 0;
        }

        #catalogo-mensaje {
            font-weight: bold;
        }
    </style>
    <script src="js/ejercicio3.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <h1>Catálogo de libros</h1>
        <p>Buscá libros escribiendo una parte de su título.</p>

        <label for="buscador-titulo">Buscar por título:</label>
        <input
            type="search"
            id="buscador-titulo"
            placeholder="Ejemplo: principito"
            autocomplete="off"
        >

        <p id="catalogo-mensaje" aria-live="polite"></p>
        <section id="catalogo-listado" aria-label="Lista de libros"></section>
    </main>
</body>
</html>
