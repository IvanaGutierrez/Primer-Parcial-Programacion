
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Catálogo de libros</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/ejercicio3.css">
    <script src="js/datos.js" defer></script>
    <script src="js/ejercicio3.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <h1>Catálogo de libros</h1>
        <p>Buscá libros escribiendo una parte de su título.</p>

        <label for="buscador-titulo">Buscar por título:</label>
        <input
            type="search"
            id="buscador-titulo"
            placeholder="Ejemplo: principito"
            autocomplete="off"
        >

        <p id="catalogo-mensaje" aria-live="polite"></p>
        <section id="catalogo-listado" aria-label="Lista de libros"></section>
    </main>
</body>
</html>
